name: Build ROAD DISPLAY PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ROAD DISPLAY PRO project
        run: |
          unzip -o Road_Display_PRO_3.0.0.zip
          echo "Project extracted"
          ls -la Road_Display_PRO

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: Road_Display_PRO
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: road-display-pro-3.0.0-debug
          path: Road_Display_PRO/app/build/outputs/apk/debug/app-debug.apk
