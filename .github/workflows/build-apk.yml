
name: Build ROAD DISPLAY PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Road_Display_PRO_3.0.0.zip
          ls -la
          ls -la Road_Display_PRO

      - name: Ensure AndroidX is enabled
        working-directory: Road_Display_PRO
        run: |
          touch gradle.properties
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi
          echo 'Effective AndroidX setting:'
          grep '^android.useAndroidX=' gradle.properties
          test "$(grep '^android.useAndroidX=' gradle.properties | tail -n 1)" = 'android.useAndroidX=true'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: Road_Display_PRO
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: road-display-pro-3.0.0-debug
          path: Road_Display_PRO/app/build/outputs/apk/debug/app-debug.apk
