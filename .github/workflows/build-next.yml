name: Build NEXT NAVI test APK

on:
  workflow_dispatch:
  push:
    branches:
      - next/architecture-baseline
    paths:
      - 'NEXT/**'
      - '.github/workflows/build-next.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests and build NEXT NAVI APK
        working-directory: NEXT
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: next-navi-alpha2-debug
          path: NEXT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
