name: NEXT NAVI PRO - build OsmAnd baseline

on:
  push:
    branches:
      - next-navi-pro/osmand-based-rebuild
    paths:
      - ".github/workflows/build-osmand-baseline.yml"
      - "NEXT_NAVI_PRO_OSMAND/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-osmand-baseline.yml"
      - "NEXT_NAVI_PRO_OSMAND/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osmand-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout official OsmAnd source
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd
          path: android
          ref: 96cbea0fb2bca3a82c7ff36bfbe2add1f472970f
          fetch-depth: 1

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources
          ref: b981dac242961d9de6135b1b0ff82cabd8f55a7d
          fetch-depth: 1

      - name: Checkout OsmAnd core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core
          path: core
          ref: 69f9df37c09463732b6c0360b01859555566dc28
          fetch-depth: 1

      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy
          ref: 7a1bb2c565ebf714b5a6bd06d1de23792c9a20b6
          fetch-depth: 1

      - name: Checkout OsmAnd build scripts
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-build
          path: build
          ref: 54356f2a6d1d07fe67510a25ec7912c0c63b277d
          fetch-depth: 1

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools
          ref: 84d3b721d70e9e8d7ac84275b4f65275b8b1c1e6
          fetch-depth: 1

      - name: Checkout OsmAnd misc resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc
          ref: 3fa7f2334740b3de68cd604725ebd02dc114d205
          fetch-depth: 1

      - name: Record upstream revisions
        shell: bash
        run: |
          {
            echo "Build date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for dir in android resources core core-legacy build tools misc; do
              echo "$dir: $(git -C "$dir" rev-parse HEAD)"
            done
            java -version 2>&1
          } | tee upstream-revisions.txt

      - name: Apply NEXT NAVI PRO in-process HUD patch
        shell: bash
        run: |
          python3 NEXT_NAVI_PRO_OSMAND/apply_next_navi_patch.py

      - name: Apply NEXT NAVI PRO app label
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("OsmAnd/build.gradle")
          s = p.read_text()
          old = 'resValue "string", "app_name", "OsmAnd Nightly"'
          new = 'resValue "string", "app_name", "NEXT NAVI PRO"'
          if s.count(old) != 1:
              raise SystemExit(f"Expected one upstream app-name value, found {s.count(old)}")
          p.write_text(s.replace(old, new))
          print("Set the debug app label to NEXT NAVI PRO")
          PY

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Build official OsmAnd debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleNightlyFreeLegacyArm64Debug 2>&1 | tee ../gradle-build.log

      - name: Verify APK exists
        shell: bash
        run: |
          find android/OsmAnd/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload build diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: next-navi-pro-build-diagnostics-${{ github.run_number }}
          path: |
            gradle-build.log
            upstream-revisions.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: next-navi-pro-osmand-arm64-${{ github.run_number }}
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct download release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-navi-pro-test-${{ github.run_number }}
          name: NEXT NAVI PRO test build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Test build based on official OsmAnd source with the app label changed to NEXT NAVI PRO.
            This is not yet a custom navigation UI build and has not been verified on a physical device.
            ARM64 APK for Android devices such as Samsung Galaxy S22 Ultra.
          files: android/OsmAnd/build/outputs/apk/**/*.apk
