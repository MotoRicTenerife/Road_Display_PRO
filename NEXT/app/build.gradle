plugins {
    id 'com.android.application'
}

android {
    namespace 'com.riccardo.roaddisplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.riccardo.roaddisplay'
        minSdk 26
        targetSdk 35
        versionCode 40000
        versionName '4.0.0-NEXT-ALPHA1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
